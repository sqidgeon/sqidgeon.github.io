<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Simple Website</title>

  <style>
    /* Built-in CSS */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #0077cc;
      color: white;
      padding: 20px 0;
      text-align: center;
    }

    nav {
      background-color: #005fa3;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: #0077cc;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Welcome to My Simple Website</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <h2>About This Site</h2>
    <p>This is a simple website created using only HTML and built-in CSS. You can edit the text, colors, and layout to make it your own.</p>

    <h3>Features</h3>
    <ul>
      <li>Clean layout</li>
      <li>Simple navigation</li>
      <li>Responsive design</li>
    </ul>
  </main>

  <footer>
    <p>&copy; 2025 My Simple Website</p>
  </footer>
</body>
</html>
